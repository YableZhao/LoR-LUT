
seed: 1337

data:
  root: ""         # 设置到 /dataset_root
  train_sub: "train"
  val_sub: "val"
  in_dir: "input"
  gt_dir: "gt"
  ext: [".jpg", ".jpeg", ".png", ".tif", ".tiff"]

model:
  G: 33
  K: 0 #when k = 0, our implementation has protect the alpha_l2 so maybe you don't need to set alpha_l2 to zero.
  R: 8        # 4 -> 8: 翻倍 capacity, 32K -> 65K params

train:
  iters: 1000000     # 200k -> 1M: 长训
  batch: 8           # 1 -> 8: T4 batch=1 几乎全是 kernel-launch 开销, batch=8 吞吐 4-5x
  patch: 256         # batch>1 必须裁切到固定尺寸. 256 比 336 安全 (PPR10K 有些图短边 ~304, 336 会跳过裁切导致 batch shape 不齐)
  log_every: 20000
  val_every: 100000
  amp: true

loss:
  l1: 1.0
  de2000: 0.0
  tv: 0.001
  mono: 0.0
  dl2: 0.0
  lpips: 0.0
  alpha_l2: 0.0001

optim:
  lr: 0.0001 #0.0001
  weight_decay: 0.00001

sched:
  cosine: true
  min_lr: 0.00001
